<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c36"><title>EROZE — Zachraň svou obec</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#163c35;background:#e9f0e9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 4%,#d4e7cd 0,transparent 42%),#edf3ec}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:780px;margin:auto;padding:20px 16px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:.15em;font-size:.82rem}.tiny{font-size:.76rem;color:#4d6a61}.pill{border:1px solid #bdd2c5;border-radius:999px;padding:7px 12px;background:#ffffffba;font-weight:700;font-size:.8rem}.hero{margin:25px 0 16px;border-radius:26px;background:#123c36;color:#f6ffeb;padding:26px;position:relative;overflow:hidden;box-shadow:0 12px 40px #163c3523}.hero:after{content:'◒';position:absolute;font-size:240px;right:-36px;bottom:-145px;color:#76aa7726;pointer-events:none}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.15em;color:#b9d8b3;font-weight:750}h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.03;max-width:550px;letter-spacing:-.045em;margin:18px 0}h2{font-size:clamp(1.55rem,5vw,2.15rem);letter-spacing:-.035em;line-height:1.18;margin:8px 0 14px}h3{margin:12px 0 6px;font-size:1rem}.hero p{max-width:560px;color:#dceee0;line-height:1.65}.card{background:#fff;border:1px solid #d4e2d5;border-radius:22px;padding:22px;box-shadow:0 5px 24px #224d3610;margin:14px 0}.muted{color:#577166;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:white;border:1px solid #d7e3da;border-radius:16px;padding:13px 10px}.stat .name{font-size:.72rem;color:#516b61}.stat .num{font-weight:850;font-size:clamp(1.1rem,4vw,1.6rem);margin-top:6px}.progress{height:8px;border-radius:15px;background:#ccded1;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:#4b9e70;transition:width .3s}.option{border:2px solid #dbe7df;background:#fbfdfb;width:100%;text-align:left;border-radius:16px;padding:15px 16px;display:block;margin:10px 0;color:#183e35}.option:focus-visible,.btn:focus-visible{outline:3px solid #e2aa45;outline-offset:2px}.option:hover{border-color:#76aa8a}.option.chosen{border-color:#207c58;background:#eaf6ed}.option strong{display:block;font-size:.98rem}.option small{display:block;margin-top:7px;line-height:1.5;color:#536c60;font-size:.86rem}.letter{display:inline-flex;align-items:center;justify-content:center;margin-right:8px;background:#e5efe7;border-radius:7px;width:24px;height:24px;font-weight:850}.btn{background:#196745;border:0;color:white;padding:14px 19px;border-radius:12px;font-weight:760;min-height:48px}.btn:hover:not(:disabled){background:#105336}.secondary{background:#eef4ed;color:#24513c;border:1px solid #bad0bf}.secondary:hover:not(:disabled){background:#dfebe0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.feedback{border-left:4px solid #2a8c62;background:#eef7f0;border-radius:5px 13px 13px 5px;padding:14px 16px;line-height:1.6}.delta{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.delta span{background:#fff;padding:7px 10px;border-radius:8px;font-weight:750;border:1px solid #d8e5d8;font-size:.86rem}.good{color:#197347}.bad{color:#a64b2f}.neutral{color:#56685c}.foot{font-size:.77rem;color:#597268;margin-top:30px;line-height:1.6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{padding:14px;border-radius:14px;background:#f2f7f0}.result b{font-size:1.38rem;display:block}.review{border-top:1px solid #dbe8dd;padding:17px 0}.review:first-child{border-top:0}.bar{height:10px;background:#dbe9de;border-radius:20px;overflow:hidden;margin-top:5px}.bar>div{height:100%;background:#398f65}.flag{display:inline-block;border-radius:7px;background:#f2e9c5;color:#65501d;font-size:.8rem;padding:5px 8px;font-weight:700}.warning{background:#fff1e6;border-left-color:#bb6a26}.note{font-size:.9rem;background:#f0f5ed;border-radius:13px;padding:13px;line-height:1.6}.link{color:#175b44;word-break:break-all}.hidden{display:none}details{background:#f4f8f3;padding:12px;border-radius:12px;margin-top:12px}summary{cursor:pointer;font-weight:750}@media(max-width:430px){.wrap{padding:12px 12px 40px}.hero{padding:23px 20px}.card{padding:17px}.stat{padding:10px 7px}.stat .name{font-size:.66rem}.stats{gap:6px}.grid2{grid-template-columns:1fr}}
@media print{body{background:white}.wrap{max-width:none}.btn,.top{display:none}.hero{background:white;color:black;border:1px solid #aaa;box-shadow:none}.hero p{color:#333}.card{box-shadow:none;break-inside:avoid}.review{break-inside:avoid}}
</style></head><body><main class="wrap" id="app" aria-live="polite"></main>
<script>
'use strict';
// Všechny peníze v milionech Kč. Kvalita půdy a spokojenost jsou didaktické indexy 0–100.
const START={money:10,soil:70,people:65,protectWater:0,protectWind:0,flags:[]};
const rounds=[
{title:'Co s velkým svažitým polem?',tag:'První rozhodnutí',story:'Nad obcí se rozkládá velké pole na svahu. Při dešti z něj teče kalná voda. Zemědělci chtějí zachovat výnosy.',options:[
['Ponechat velký lán a pěstovat kukuřici bez dalších úprav','Rychlý ekonomický přínos, ale holá půda v části roku a řádky po svahu zvyšují riziko odtoku.',{money:4,soil:-14,people:3,protectWater:-1},'Velký lán bez ochranných prvků je na svažité půdě zranitelný, zvlášť při přívalových srážkách.','intensive'],
['Rozdělit pole travnatými pásy po vrstevnicích','Něco to stojí a ubere produkční plochu; pásy zpomalují vodu.',{money:-2,soil:9,people:0,protectWater:3},'Travnaté pásy a vedení opatření po vrstevnicích omezují soustředěný odtok.','strips'],
['Zatravnit nejohroženější část svahu','Menší výměra pro plodiny; výrazná ochrana exponovaného místa.',{money:-3,soil:12,people:-2,protectWater:4},'Trvalý vegetační pokryv má velký protierozní přínos zejména na rizikových svazích.','grass'],
['Přejít na střídání plodin a meziplodiny','Průběžná péče je náročnější, půda nebude dlouho holá.',{money:-1,soil:8,people:2,protectWater:2,protectWind:1},'Osevní postup a meziplodiny pomáhají udržet pokryv a strukturu půdy.','cover']
]},
{title:'Nabídka od investora',tag:'Rozvoj obce',story:'Investor chce pronajmout obecní pozemky a nabízí peníze do rozpočtu. Pozemky leží v krajině ohrožené erozí.',options:[
['Povolit rozorání mezí a spojení polí','Velký jednorázový příjem; ubudou krajinné prvky.',{money:6,soil:-16,people:0,protectWater:-2,protectWind:-2},'Odstranění mezí a vegetačních linií může zvýšit délku odtoku i náchylnost k větrné erozi.','remove'],
['Přijmout investici jen se zachováním mezí','Menší příjem, ale ochranné prvky zůstanou.',{money:3,soil:-2,people:3,protectWater:0,protectWind:0},'Podmínky hospodaření mohou omezit negativní dopady velkoplošného využití.','conditional'],
['Odmítnout projekt a vybudovat remízek','Výdaj nyní; vegetační bariéra pro vítr a biodiverzitu.',{money:-3,soil:9,people:1,protectWind:4,protectWater:1},'Remízky a větrolamy mohou zpomalovat vítr a zlepšovat pestrost krajiny.','grove'],
['Pronajmout jen část a výnos investovat do zeleně','Kompromis mezi příjmem a dlouhodobou ochranou.',{money:1,soil:5,people:4,protectWind:2,protectWater:1},'Kombinace hospodářského využití a krajinných prvků může rozložit přínosy i rizika.','mixed']
]},
{title:'Přichází suché léto',tag:'Dlouhodobé sucho',story:'Půda vysychá a některé plochy jsou bez rostlin. Zároveň roste obava z nižších výnosů.',options:[
['Zvýšit intenzitu zpracování půdy a nechávat ji holou','Krátkodobě jednoduchý postup; půda ztrácí ochranný pokryv.',{money:3,soil:-12,people:-2,protectWind:-2},'Holá a rozrušená půda může být za sucha náchylnější k odnosu větrem.','bare'],
['Použít meziplodiny a ponechat posklizňové zbytky','Výdaj a změna organizace práce; půda je lépe krytá.',{money:-2,soil:10,people:2,protectWind:3,protectWater:1},'Pokryv a zbytky rostlin snižují přímé působení větru a dešťových kapek.','mulch'],
['Dotovat zavlažování bez změny hospodaření','Pomoc výnosům, vysoké náklady a bez přímé ochrany před erozí.',{money:-4,soil:0,people:7},'Závlaha může pomoci rostlinám, sama ale nenahrazuje protierozní management.','irrigate'],
['Podpořit pestřejší osevní postup a organickou hmotu','Postupné výsledky a investice do dlouhodobé odolnosti.',{money:-3,soil:13,people:0,protectWater:1,protectWind:2},'Organická hmota a vhodné střídání plodin podporují půdní strukturu.','organic']
]},
{title:'Přívalový déšť!',tag:'Krizové kolo',story:'Během krátké doby spadlo mimořádné množství srážek. Čím hůře je půda chráněna, tím větší mohou být škody. Na konci tohoto kola se projeví následky předchozích rozhodnutí.',event:'rain',options:[
['Zaplatit rychlou opravu škod a pokračovat beze změn','Okamžitě pomůže provozu, ale příčina zůstává.',{money:-2,soil:-5,people:4},'Samotná oprava neřeší vznik erozního odtoku.','repair'],
['Založit zatravněné údolnice a průlehy','Nákladné, ale smysluplné vedení a zpomalování odtoku.',{money:-4,soil:12,people:1,protectWater:4},'Správně navržené zatravněné dráhy soustředěného odtoku pomáhají bránit vzniku rýh.','swales'],
['Prosadit změnu obdělávání po vrstevnicích','Levnější organizační opatření s účinkem závislým na terénu.',{money:-1,soil:7,people:-1,protectWater:2},'Orba a setí po vrstevnicích mohou zpomalit odtok, nejsou ale univerzálním řešením.','contour'],
['Odložit zásahy a šetřit rozpočet','Teď nic nestojí; riziko přetrvává.',{money:0,soil:-11,people:-8,protectWater:-1},'Nedostatečná ochrana se může při další bouřce prodražit.','delay']
]},
{title:'Spor se zemědělci',tag:'Vyjednávání',story:'Farmáři upozorňují na náklady protierozních opatření. Obyvatelé pod svahem zase nechtějí další nánosy bahna.',options:[
['Zrušit omezení a podpořit maximalizaci výnosů','Více peněz, ale větší dlouhodobé riziko.',{money:4,soil:-13,people:-5,protectWater:-2},'Krátkodobé příjmy nejsou totéž co dlouhodobá udržitelnost.','yield'],
['Dotovat ochranné pásy při zachování produkce','Mírný kompromis, který něco stojí.',{money:-2,soil:9,people:7,protectWater:2},'Spolupráce s hospodařícími subjekty může zlepšit přijatelnost opatření.','subsidy'],
['Na nejrizikovějších pozemcích zavést přísnější pravidla','Silný účinek, ale část zemědělců protestuje.',{money:-2,soil:12,people:-5,protectWater:3},'Cílená pravidla na rizikových plochách mohou půdu chránit; je třeba řešit dopady na hospodaření.','rules'],
['Svolat dohodu a sestavit plán péče o půdu','Pomalejší a méně výrazný okamžitý zásah; široká podpora.',{money:-1,soil:6,people:10,protectWater:1,protectWind:1},'Zohlednění místních podmínek a zájmů může vést k trvalejší spolupráci.','agreement']
]},
{title:'Prašná větrná bouře',tag:'Krizové kolo',story:'Po několika týdnech sucha přichází silný vítr. Odkrytá ornice se mění v prach. Na konci tohoto kola dřívější ochrana před větrem ovlivní škody.',event:'wind',options:[
['Vysadit souvislé větrolamy na vhodných místech','Vyšší náklady, přínos se naplno projeví časem.',{money:-3,soil:11,people:3,protectWind:4},'Vhodně umístěné větrolamy snižují rychlost větru u povrchu; stromy však nerostou okamžitě.','windbreak'],
['Omezit dobu, kdy je ornice odkrytá','Praktická změna hospodaření.',{money:-2,soil:10,people:1,protectWind:3},'Vegetační kryt a posklizňové zbytky chrání půdu před odnosem.','coverWind'],
['Nahradit ztráty jednorázovou podporou','Oblíbené řešení, ale málo mění příčinu problému.',{money:-3,soil:0,people:7},'Kompenzace škod není sama o sobě protierozním opatřením.','compensate'],
['Nechat situaci bez zásahu','Ušetříte teď, půda dál ztrácí jemné částice.',{money:1,soil:-13,people:-8,protectWind:-1},'Opakovaný odnos nejjemnějších půdních částic ohrožuje úrodnost.','ignoreWind']
]},
{title:'Dotace na obnovu krajiny',tag:'Příležitost',story:'Obec může podat žádost o podporu. Musí ale dodat vlastní prostředky a přijmout závazky. V naší simulaci jsou částky zjednodušené.',options:[
['Využít podporu na pásy vegetace a remízky','Dotace převyšuje spoluúčast; získáte finance i ochranu.',{money:2,soil:10,people:5,protectWind:2,protectWater:2},'Dobře zacílená podpora může spojit veřejný zájem a lokální hospodaření.','grantGreen'],
['Získané prostředky využít jen na obecní infrastrukturu','V této herní variantě jde o jiný, neekologický zdroj peněz; ochrana půdy se nemění.',{money:4,soil:0,people:4},'Infrastruktura může být důležitá, ale automaticky neposkytne protierozní ochranu.','grantInfra'],
['Odmítnout všechny závazky a dotace','Bez administrativy a dalších výdajů.',{money:0,soil:0,people:-2},'Rozhodnutí nic neriskovat znamená také vzdát se možné investice do krajiny.','refuse'],
['Doplnit dotaci vlastními penězi a obnovit mokřad i travnaté pásy','Vyšší čisté náklady, komplexnější krajinný zásah.',{money:-2,soil:13,people:3,protectWater:3,protectWind:1},'Mokřady a vegetační prvky mohou podpořit retenci a ekologické funkce krajiny; jejich umístění musí odpovídat lokalitě.','wetland']
]},
{title:'Poslední varování meteorologů',tag:'Finální strategie',story:'Blíží se další extrémní bouřka. Máte poslední možnost upravit ochranu obce. Po potvrzení se projeví následky a hra skončí.',event:'final',options:[
['Investovat do trvalého vegetačního pokryvu na svazích','Výrazné zlepšení ochrany za cenu investice.',{money:-4,soil:13,people:2,protectWater:4,protectWind:1},'Ochranný vegetační kryt patří k základním opatřením na rizikových svazích.','finalGrass'],
['Vybudovat vhodně umístěné zatravněné odtokové dráhy','Snížení rizika soustředěného odtoku.',{money:-3,soil:10,people:1,protectWater:4},'Ochrana údolnic a odtokových drah může snížit škody ze soustředěného odtoku.','finalDrain'],
['Připravit krizové bariéry kolem domů','Omezuje možné škody na majetku, ale nechrání samotnou ornici.',{money:-2,soil:0,people:7,protectWater:1},'Ochrana zastavěného území není náhradou péče o zemědělskou půdu.','barriers'],
['Neinvestovat a ponechat finanční rezervu','Více prostředků na případné opravy; riziko eroze trvá.',{money:0,soil:-5,people:-4},'Rezerva pomůže zvládat následky, ale nevyloučí další odnos půdy.','reserve']
]}
];
let state=null;
const app=document.getElementById('app');
const cap=n=>Math.max(0,Math.min(100,n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return {stage:'intro',step:0,values:structuredClone(START),history:[],eventNotice:null,selected:null};}
function save(){try{localStorage.setItem('eroze-game-v1',JSON.stringify(state));}catch(e){}}
function load(){try{const p=JSON.parse(localStorage.getItem('eroze-game-v1'));if(p&&p.values&&Array.isArray(p.history)&&Number.isInteger(p.step)&&p.step>=0&&p.step<=8&&['intro','question','effect','end'].includes(p.stage))return p}catch(e){}return fresh()}
state=load();
function money(n){return n.toLocaleString('cs-CZ',{maximumFractionDigits:0})+' mil. Kč'}
function changeHTML(d){return `<div class="delta"><span class="${d.money>=0?'good':'bad'}">Rozpočet ${d.money>0?'+':''}${d.money} mil.</span><span class="${d.soil>=0?'good':'bad'}">Půda ${d.soil>0?'+':''}${d.soil}</span><span class="${d.people>=0?'good':'bad'}">Obyvatelé ${d.people>0?'+':''}${d.people}</span></div>`}
function adjust(d){const v=state.values;v.money+=d.money||0;v.soil=cap(v.soil+(d.soil||0));v.people=cap(v.people+(d.people||0));v.protectWater+=d.protectWater||0;v.protectWind+=d.protectWind||0}
function storm(type){const v=state.values;let loss,soilLoss,pLoss;if(type==='rain'){loss=Math.max(1,Math.round(7-v.protectWater*.7-(v.soil-60)*.035));soilLoss=Math.max(2,Math.round(15-v.protectWater*1.2-(v.soil-60)*.1));pLoss=Math.max(1,Math.round(loss*.9));}else if(type==='wind'){loss=Math.max(1,Math.round(5-v.protectWind*.6-(v.soil-60)*.025));soilLoss=Math.max(1,Math.round(12-v.protectWind*1.2-(v.soil-60)*.06));pLoss=Math.max(1,Math.round(loss*.8));}else{loss=Math.max(1,Math.round(9-v.protectWater*.8-(v.soil-60)*.04));soilLoss=Math.max(2,Math.round(18-v.protectWater*1.35-(v.soil-60)*.08));pLoss=Math.max(1,Math.round(loss*.8));}const d={money:-loss,soil:-soilLoss,people:-pLoss};adjust(d);return {type,d};}
function scores(){const v=state.values;const economy=cap(Math.round(50+v.money*2.5));const soil=v.soil;const people=v.people;const total=Math.round(soil*.45+economy*.35+people*.2);return {economy,soil,people,total};}
function intro(){return `<section class="hero"><div class="eyebrow">Interaktivní strategická hra</div><h1>EROZE<br>Zachraň svou obec.</h1><p>Jsi ve vedení obce, kterou ohrožuje vodní i větrná eroze. Rozhoduj o půdě, penězích a životě obyvatel. Každá výhoda může mít svou cenu.</p></section><section class="card"><h2>Tvá mise</h2><p class="muted">Čeká tě <b>8 rozhodnutí</b>, vždy ze 4 možností. Všichni začínáte stejně. Pozor: některé volby přinesou peníze, ale poškodí půdu. Tvoje starší rozhodnutí ovlivní škody při bouřkách.</p>${stats(START)}<p class="note">Po rozhodnutí uvidíš jeho důsledky, ne správnost odpovědi. Vysvětlení a všechna svá rozhodnutí si otevřeš až na konci. Počítá se ekonomická stabilita (35 %), kvalita půdy (45 %) a spokojenost obyvatel (20 %).</p><button class="btn" data-action="start">Začít rozhodovat →</button><p class="foot">Model je vzdělávací simulace: ceny, bodové změny i události jsou záměrně zjednodušené a nejsou předpovědí reálných dopadů.</p></section>`}
function stats(v){return `<div class="stats"><div class="stat"><div class="name">💰 Rozpočet</div><div class="num">${v.money} mil.</div></div><div class="stat"><div class="name">🌱 Půda</div><div class="num">${v.soil}/100</div></div><div class="stat"><div class="name">🏘️ Obyvatelé</div><div class="num">${v.people}/100</div></div></div>`}
function question(){const r=rounds[state.step];const n=state.step+1;return `<header class="top"><span class="brand">EROZE / HRA</span><span class="pill">Kolo ${n} / 8</span></header><div class="progress"><div style="width:${(state.step/8)*100}%"></div></div>${stats(state.values)}<section class="card"><div class="eyebrow" style="color:#39845e">${esc(r.tag)}</div><h2>${esc(r.title)}</h2><p class="muted">${esc(r.story)}</p>${r.options.map((o,i)=>`<button type="button" class="option ${state.selected===i?'chosen':''}" data-choice="${i}" aria-pressed="${state.selected===i}"><strong><span class="letter">${'ABCD'[i]}</span>${esc(o[0])}</strong><small>${esc(o[1])}</small></button>`).join('')}<div class="actions"><button class="btn" data-action="confirm" ${state.selected===null?'disabled':''}>Potvrdit rozhodnutí →</button></div><p class="foot">Volba je po potvrzení nevratná. Žádná možnost není předem označena jako správná.</p></section>`}
function effect(){const h=state.history.at(-1);const r=rounds[h.round];const o=r.options[h.choice];return `<header class="top"><span class="brand">EROZE / DŮSLEDKY</span><span class="pill">Kolo ${h.round+1} / 8</span></header><div class="progress"><div style="width:${(h.round+1)/8*100}%"></div></div><section class="card"><div class="eyebrow" style="color:#39845e">Rozhodnutí potvrzeno</div><h2>${esc(o[0])}</h2><p class="muted">${esc(o[1])}</p><h3>Bezprostřední dopady</h3>${changeHTML(o[2])}${h.event?`<div class="feedback warning"><b>${h.event.type==='rain'?'🌧️ Přívalový déšť':h.event.type==='wind'?'🌬️ Větrná bouře':'⛈️ Závěrečná bouřka'}:</b> Předchozí stav půdy a ochranná opatření ovlivnily škody.${changeHTML(h.event.d)}<small>Výpočet zohledňuje předchozí rozhodnutí. Nejde o skutečnou meteorologickou prognózu.</small></div>`:''}<h3>Aktuální stav obce</h3>${stats(state.values)}${state.values.money<0?'<p class="feedback warning"><b>Rozpočtový schodek!</b> Obec utrácí více, než má. Hra pokračuje, ale zadlužení zhorší závěrečné ekonomické hodnocení.</p>':''}<div class="actions"><button class="btn" data-action="next">${h.round===7?'Zobrazit konečný výsledek':'Pokračovat do dalšího kola'} →</button></div></section>`}
function ending(){const s=scores(),v=state.values;let title=s.total>=80?'Krajina má dobrou budoucnost':s.total>=65?'Rozumný kompromis':s.total>=45?'Křehká rovnováha':'Obec v ohrožení';return `<header class="top"><span class="brand">EROZE / VÝSLEDKY</span><span class="pill">8 / 8 kol</span></header><section class="hero"><div class="eyebrow">Konec hry</div><h1>${s.total} / 100 bodů</h1><h2 style="color:#f6ffeb">${title}</h2><p>Tvá rozhodnutí ovlivnila ekonomiku, stav půdy i spokojenost obyvatel. Neexistuje jediná dokonalá cesta — důležité je umět své kroky obhájit.</p></section><section class="card"><h2>Stav obce po osmi kolech</h2>${stats(v)}<p class="muted">Bodový model: kvalita půdy 45 %, ekonomická stabilita 35 %, spokojenost 20 %. Ekonomický index = 50 + 2,5 × konečný rozpočet (omezený na 0–100).</p>${[['Půda',s.soil,45],['Ekonomika',s.economy,35],['Obyvatelé',s.people,20]].map(a=>`<p style="margin-bottom:4px"><b>${a[0]}:</b> ${a[1]}/100 · váha ${a[2]} %</p><div class="bar"><div style="width:${a[1]}%"></div></div>`).join('')}${v.money<0?'<p class="feedback warning"><b>Pozor:</b> obec skončila ve schodku. Ani vysoká kvalita půdy sama o sobě nezaručí finanční udržitelnost.</p>':''}</section><section class="card"><h2>Tvých 8 rozhodnutí</h2><p class="muted">Rozklikni každé kolo: zjistíš odborné zdůvodnění své volby i to, jaké byly další možnosti. Tento přehled použij při společné diskusi.</p>${state.history.map(h=>{const r=rounds[h.round],o=r.options[h.choice];return `<article class="review"><span class="flag">Kolo ${h.round+1}</span><h3>${esc(r.title)}</h3><b>${'ABCD'[h.choice]}. ${esc(o[0])}</b>${changeHTML(o[2])}<details><summary>Proč a jaké byly alternativy?</summary><p>${esc(o[3])}</p><h3>Ostatní možnosti</h3>${r.options.map((alt,j)=>`<p><b>${'ABCD'[j]}${j===h.choice?' (tvá volba)':''}:</b> ${esc(alt[0])}<br><span class="tiny">${esc(alt[3])}</span></p>`).join('')}</details>${h.event?`<p class="tiny">Krizová událost: ${h.event.d.money} mil. Kč, ${h.event.d.soil} bodů půdy, ${h.event.d.people} bodů spokojenosti.</p>`:''}</article>`}).join('')}<div class="actions"><button class="btn secondary" data-action="print">Uložit výsledek / tisk</button><button class="btn" data-action="restart">Hrát znovu ↺</button></div><p class="foot">Ve výukové simulaci nejsou všechny dopady měřeny reálnými jednotkami. Index půdy vyjadřuje zjednodušenou kondici a erozní odolnost, nikoli laboratorní kvalitu půdy.</p></section>`}
function render(){app.innerHTML=state.stage==='intro'?intro():state.stage==='question'?question():state.stage==='effect'?effect():ending();save();}
app.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice&&state.stage==='question'){state.selected=Number(choice.dataset.choice);render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start'){state.stage='question';state.step=0;state.selected=null;}else if(a==='confirm'&&state.stage==='question'&&state.selected!==null){const round=state.step,choice=state.selected,o=rounds[round].options[choice];adjust(o[2]);let event=null;if(rounds[round].event)event=storm(rounds[round].event);state.history.push({round,choice,event});state.stage='effect';state.selected=null;}else if(a==='next'&&state.stage==='effect'){state.step++;state.stage=state.step>=8?'end':'question';}else if(a==='restart'){if(!confirm('Opravdu začít znovu? Současný výsledek se smaže.'))return;state=fresh();}else if(a==='print'){window.print();return;}render();window.scrollTo({top:0,behavior:'instant'});});
render();
</script></body></html>
